[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "project-herdr"
version = "0.1.0"
description = "Coordinator control plane for multi-repo agent work, with Herdr as the optional dispatch runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "oldwinter" }]
dependencies = []

[project.scripts]
project-herdr = "project_herdr.cli:main"
ph = "project_herdr.cli:main"

[project.urls]
Homepage = "https://github.com/oldwinter/project-herdr"
Repository = "https://github.com/oldwinter/project-herdr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
